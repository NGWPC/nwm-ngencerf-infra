<svg viewBox="0 0 1600 900" width="1600" height="900" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#eef2f7"/>

  <text x="60" y="72" font-size="44" font-weight="700" fill="#232f3e">ngenCERF on AWS</text>
  <text x="60" y="108" font-size="21" fill="#64748b">Deployed end to end with Terraform</text>

  <rect x="180" y="150" width="1180" height="640" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="205" y="182" font-size="17" font-weight="600" fill="#64748b" letter-spacing="1">EXISTING VPC &#183; PRIVATE SUBNETS</text>

  <g filter="url(#shadow)">
    <rect x="30" y="300" width="115" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <circle cx="87" cy="335" r="14" fill="none" stroke="#232f3e" stroke-width="3"/>
  <path d="M 64 377 Q 87 353 110 377" fill="none" stroke="#232f3e" stroke-width="3" stroke-linecap="round"/>
  <text x="87" y="391" font-size="18" font-weight="600" fill="#232f3e" text-anchor="middle">Browser</text>

  <g filter="url(#shadow)">
    <rect x="30" y="425" width="115" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="63" y="448" width="48" height="34" rx="6" fill="#232f3e"/>
  <text x="87" y="471" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Menlo, Consolas, monospace">&gt;_</text>
  <text x="87" y="507" font-size="18" font-weight="600" fill="#232f3e" text-anchor="middle">CLI</text>
  <text x="87" y="545" font-size="13" fill="#64748b" text-anchor="middle">same API, from anywhere</text>

  <line x1="145" y1="350" x2="226" y2="408" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="145" y1="472" x2="226" y2="448" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <g filter="url(#shadow)">
    <rect x="230" y="370" width="185" height="110" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <text x="322" y="408" font-size="19" font-weight="700" fill="#232f3e" text-anchor="middle">Application</text>
  <text x="322" y="432" font-size="19" font-weight="700" fill="#232f3e" text-anchor="middle">Load Balancer</text>
  <text x="322" y="458" font-size="15" fill="#64748b" text-anchor="middle">routes all web traffic</text>

  <rect x="470" y="210" width="330" height="330" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="495" y="242" font-size="17" font-weight="700" fill="#1d4ed8">ECS FARGATE &#183; WEB TIER</text>
  <g filter="url(#shadow)">
    <rect x="495" y="262" width="280" height="100" rx="12" fill="#ffffff" stroke="#93c5fd"/>
  </g>
  <text x="635" y="302" font-size="20" font-weight="700" fill="#232f3e" text-anchor="middle">Nuxt UI</text>
  <text x="635" y="330" font-size="15" fill="#64748b" text-anchor="middle">web interface container</text>
  <g filter="url(#shadow)">
    <rect x="495" y="395" width="280" height="110" rx="12" fill="#ffffff" stroke="#93c5fd"/>
  </g>
  <text x="635" y="435" font-size="20" font-weight="700" fill="#232f3e" text-anchor="middle">Django API</text>
  <text x="635" y="463" font-size="15" fill="#64748b" text-anchor="middle">app server &#183; submits jobs</text>

  <line x1="415" y1="405" x2="491" y2="322" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="437" y="345" font-size="15" fill="#475569" paint-order="stroke" stroke="#f8fafc" stroke-width="5">default</text>
  <line x1="415" y1="440" x2="491" y2="445" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="428" y="472" font-size="15" fill="#475569" paint-order="stroke" stroke="#f8fafc" stroke-width="5">/api/*</text>

  <rect x="900" y="210" width="440" height="255" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="925" y="242" font-size="17" font-weight="700" fill="#b45309">AWS PCS &#183; MANAGED SLURM COMPUTE</text>
  <g filter="url(#shadow)">
    <rect x="925" y="262" width="150" height="118" rx="12" fill="#ffffff" stroke="#fcd34d"/>
  </g>
  <text x="1000" y="310" font-size="19" font-weight="700" fill="#232f3e" text-anchor="middle">Slurm</text>
  <text x="1000" y="334" font-size="19" font-weight="700" fill="#232f3e" text-anchor="middle">controller</text>
  <g filter="url(#shadow)">
    <rect x="1090" y="262" width="228" height="118" rx="12" fill="#ffffff" stroke="#fcd34d"/>
  </g>
  <text x="1204" y="290" font-size="19" font-weight="700" fill="#232f3e" text-anchor="middle">Compute nodes</text>
  <text x="1204" y="312" font-size="14" fill="#64748b" text-anchor="middle">autoscale 0 &#8594; 50</text>
  <text x="1204" y="338" font-size="13" fill="#334155" text-anchor="middle">c5n.9xlarge: up to 500 catchments</text>
  <text x="1204" y="360" font-size="13" fill="#334155" text-anchor="middle">r8a.12xlarge: over 500 catchments</text>
  <text x="1120" y="430" font-size="15" fill="#92400e" text-anchor="middle">jobs run in Apptainer containers staged on the shared drive</text>

  <line x1="775" y1="430" x2="896" y2="340" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="855" y="365" font-size="15" fill="#475569" paint-order="stroke" stroke="#f8fafc" stroke-width="5">job submission (Slurm REST)</text>

  <g filter="url(#shadow)">
    <rect x="330" y="620" width="280" height="115" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="470" y="663" font-size="20" font-weight="700" fill="#232f3e" text-anchor="middle">RDS Postgres</text>
  <text x="470" y="691" font-size="15" fill="#64748b" text-anchor="middle">application database</text>
  <g filter="url(#shadow)">
    <rect x="650" y="620" width="280" height="115" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="790" y="663" font-size="20" font-weight="700" fill="#232f3e" text-anchor="middle">ElastiCache Redis</text>
  <text x="790" y="691" font-size="15" fill="#64748b" text-anchor="middle">cache</text>
  <g filter="url(#shadow)">
    <rect x="970" y="608" width="360" height="140" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="1150" y="640" font-size="20" font-weight="700" fill="#232f3e" text-anchor="middle">EFS shared storage</text>
  <text x="1150" y="664" font-size="14" fill="#64748b" text-anchor="middle">one drive, seen from two mount points:</text>
  <text x="990" y="692" font-size="13" fill="#334155" font-family="Menlo, Consolas, monospace">Django:  /ngencerf/data</text>
  <text x="990" y="714" font-size="13" fill="#334155" font-family="Menlo, Consolas, monospace">compute: /ngencerf-app/data/ngen-cal-data</text>
  <text x="990" y="736" font-size="13" fill="#334155" font-family="Menlo, Consolas, monospace">sifs:    /ngencerf-app/singularity</text>

  <line x1="560" y1="505" x2="500" y2="616" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="700" y1="505" x2="770" y2="616" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="775" y1="480" x2="1030" y2="604" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="1204" y1="380" x2="1180" y2="604" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <g filter="url(#shadow)">
    <rect x="1380" y="580" width="210" height="185" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="1485" y="612" font-size="19" font-weight="700" fill="#232f3e" text-anchor="middle">S3 buckets</text>
  <text x="1485" y="634" font-size="13" fill="#64748b" text-anchor="middle">existing, shared across envs</text>
  <text x="1394" y="662" font-size="11" fill="#334155" font-family="Menlo, Consolas, monospace">ngwpc-ngencerf-zips/{env}</text>
  <text x="1394" y="684" font-size="11" fill="#334155" font-family="Menlo, Consolas, monospace">ngwpc-ngencerf-archive/{env}</text>
  <text x="1394" y="706" font-size="11" fill="#334155" font-family="Menlo, Consolas, monospace">ngwpc-forcing</text>
  <text x="1394" y="728" font-size="11" fill="#334155" font-family="Menlo, Consolas, monospace">ngwpc-dev (tool data)</text>
  <line x1="1330" y1="677" x2="1376" y2="672" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <g font-size="16" fill="#334155">
    <rect x="180" y="822" width="330" height="44" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="345" y="850" text-anchor="middle">&#128274; Encrypted at rest with KMS</text>
    <rect x="530" y="822" width="360" height="44" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="710" y="850" text-anchor="middle">&#128273; Passwords live in Secrets Manager</text>
    <rect x="910" y="822" width="360" height="44" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1090" y="850" text-anchor="middle">&#128737; Least-privilege IAM role per service</text>
  </g>
</svg>
